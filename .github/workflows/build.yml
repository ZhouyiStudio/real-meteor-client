```yaml
name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-meteor-client
          path: build/libs/*.jar
          if-no-files-found: error
```

就是：

**Checkout → Java 21 → `./gradlew build` → 上传 `build/libs/*.jar`。**
